name: Backend Job Telegram Alert

on:
  schedule:
    # Runs hourly between 9:00 AM and 9:00 PM IST (3:30 AM to 3:30 PM UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:        # Keeps manual execution button available anytime

permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram Alert Script
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u scraper.py

      - name: Save processed job history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "chore: update processed job list [skip ci]" || exit 0
          git push
